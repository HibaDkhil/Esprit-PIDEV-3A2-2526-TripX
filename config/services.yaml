parameters:
    env(TRANSPORTAI): ''
    env(RAGHED_GEMINI): ''
    env(SERPAPI_API_KEY): ''
    env(OPENWEATHER_API_KEY): ''
    env(ELEVENLABS_API_KEY): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ============ SECURITY HANDLERS ============
    
    App\Security\LoginSuccessHandler:
        arguments:
            - '@router'
            - '@doctrine.orm.entity_manager'
            - '@App\service\PreferenceService'

    App\Security\LoginFailureHandler:
        arguments:
            $router: '@router'

    # ============ GEMINI SERVICE ============
    
    App\service\GeminiService:
        arguments:
            $httpClient: '@http_client'
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $geminiModel: '%env(GEMINI_MODEL)%'

    # ============ AUTH CONTROLLER INJECTIONS ============
    
    App\Controller\user\AuthController:
        calls:
            - setAuthService: ['@App\service\AuthService']
            - setSecurity: ['@Symfony\Bundle\SecurityBundle\Security']
            - setPreferenceService: ['@App\service\PreferenceService']

    # ============ ACCOMMODATION SERVICES ============
    
    # Cache Service
    App\service\Accommodation\CacheService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Weather Service
    App\service\Accommodation\WeatherService:
        arguments:
            $httpClient: '@http_client'
            $cache: '@App\service\Accommodation\CacheService'
            $openWeatherApiKey: '%env(OPENWEATHER_API_KEY)%'

    # SerpApiService base class
    App\service\Accommodation\SerpApiService:
        arguments:
            $httpClient: '@http_client'
            $cache: '@App\service\Accommodation\CacheService'
            $serpApiKey: '%env(SERPAPI_API_KEY)%'

    # Image Service
    App\service\Accommodation\ImageService:
        arguments:
            $httpClient: '@http_client'
            $cache: '@App\service\Accommodation\CacheService'
            $serpApiKey: '%env(SERPAPI_API_KEY)%'

    # Local Service
    App\service\Accommodation\LocalService:
        arguments:
            $httpClient: '@http_client'
            $cache: '@App\service\Accommodation\CacheService'
            $serpApiKey: '%env(SERPAPI_API_KEY)%'

    # Review Service
    App\service\Accommodation\ReviewService:
        arguments:
            $httpClient: '@http_client'
            $cache: '@App\service\Accommodation\CacheService'
            $serpApiKey: '%env(SERPAPI_API_KEY)%'

    # Flight Service
    App\service\Accommodation\FlightService:
        arguments:
            $httpClient: '@http_client'
            $cache: '@App\service\Accommodation\CacheService'
            $serpApiKey: '%env(SERPAPI_API_KEY)%'

    # Itinerary Service
    App\service\Accommodation\ItineraryService:
        arguments:
            $cache: '@App\service\Accommodation\CacheService'
            $geminiApiKey: '%env(RAGHED_GEMINI)%'

    # RoomInsightsService
    App\service\Accommodation\RoomInsightsService:
        arguments:
            $raggedGemini: '%env(RAGHED_GEMINI)%'

    # Google Calendar Service
    App\service\Accommodation\GoogleCalendarAccService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Booking Mailer Service
    App\service\Accommodation\BookingAccMailerService:
        arguments:
            $mailer: '@mailer.mailer'
            $userRepo: '@App\Repository\UserRepository'
            $fromEmail: '%env(BOOKING_MAILER_FROM)%'
            $fromName: '%env(BOOKING_MAILER_NAME)%'

    # Notification Service
    App\service\NotificationService:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $notificationRepo: '@App\Repository\AdminNotificationRepository'

    # Image Watermark Service
    App\service\Accommodation\ImageWatermarkService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # ============ CALENDARIFIC SERVICE ============
    
    App\service\CalendarificService:
        arguments:
            $calendarificApiKey: '%env(CALENDARIFIC_API_KEY)%'
    
    # ============ GEMINI PACK SERVICE ============
    
    App\service\GeminiPackService:
        arguments:
            $apiKey: '%env(GROQ_PACK_API_KEY)%'
    
    # ============ ADMIN CONTROLLERS ============
    
    App\Controller\admin\AdminPacksController:
        arguments:
            $paginator: '@knp_paginator'
    
    App\Controller\admin\OverviewController:
        arguments:
            $groqApiKey: '%env(TRANSPORTAI)%'
        tags: ['controller.service_arguments']

    # ============ TRANSPORT SERVICES ============
    
    # Transport Optimal Route Service
    App\service\TransportOptimalRouteService:
        arguments:
            $groqApiKey: '%env(TRANSPORTAI)%'

    # ============ AI COMPARISON CONTROLLER ============

    App\Controller\user\AIComparisonController:
        arguments:
            $transportAiKey: '%env(TRANSPORTAI)%'
        tags: ['controller.service_arguments']

    # ============ HEALTH CHECK SERVICES ============
    
    # ElevenLabs API Health Check
    App\service\HealthCheck\ElevenLabsStatusCheck:
        arguments:
            $elevenLabsApiKey: '%env(ELEVENLABS_API_KEY)%'
        tags:
            - { name: liip_monitor.check, alias: eleven_labs_api }

    # Mailer Health Check
    App\service\HealthCheck\MailerStatusCheck:
        arguments:
            $transport: '@mailer.default_transport'
        tags:
            - { name: liip_monitor.check, alias: symfony_mailer }

    # Redis Health Check
    App\service\HealthCheck\RedisStatusCheck:
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
        tags:
            - { name: liip_monitor.check, alias: redis_status }

    # ============ TWO-FACTOR AUTHENTICATION SERVICES ============
    
    Scheb\TwoFactorBundle\Security\TwoFactor\Provider\Google\GoogleTotpFactory:
        alias: scheb_two_factor.security.google_totp_factory
        public: true

    Scheb\TwoFactorBundle\Security\TwoFactor\Provider\Google\GoogleAuthenticator:
        arguments:
            $totpFactory: '@scheb_two_factor.security.google_totp_factory'
            $leeway: 0
        public: true