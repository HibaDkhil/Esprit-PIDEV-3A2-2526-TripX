# Read the documentation: https://symfony.com/doc/current/bundles/FOSCKEditorBundle/index.html

twig:
    form_themes:
        - '@FOSCKEditor/Form/ckeditor_widget.html.twig'

fos_ck_editor:
    base_path: "https://cdn.ckeditor.com/4.22.1/standard-all/"
    configs:
        basic_config:
            toolbar:
                - [ "Bold", "Italic", "Strikethrough", "-", "NumberedList", "BulletedList", "-", "Link", "Unlink" ]
                - [ "Undo", "Redo" ]
            uiColor: "#ffffff"
            height: "150px"
